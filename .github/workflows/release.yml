name: リリース

# 手順は docs/release.md。release ラベル付きの Issue で、develop から release/v<version> と main への PR を作る。
# その PR をマージしたら、タグ v<version> と GitHub Release を作る。マージは人が行う
# issues のイベントは、既定のブランチ（main）にある版で動く。ラベルが付いたときも動く変更（labeled）は、main に入ってから効く
on:
  issues:
    # Issue フォームのラベルは、Issue を作った後に付く。opened のときの Issue には release ラベルが無いことがあり、
    # opened だけでは動かないため、ラベルが付いたとき（labeled）も受ける。同じ Issue で 2 回動かない仕組みは、once のジョブ
    types: [opened, labeled]
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

# 2 つのリリースが同時に走り、同じ版のブランチやタグを作り合わないようにする。
# 排他は、ブランチやタグを作る create_release_pr と publish_release のジョブだけに付ける。
# ワークフロー全体に付けると、関係の無い Issue のラベル付けで起きた実行が、待っている publish_release を取り消すため

jobs:
  once:
    name: リリースの PR を作り済みかを確かめる
    # 公開リポジトリでは誰でも Issue フォームから release ラベルを付けられるため、書き込み権限のある人の Issue だけを受ける
    # opened は Issue の release ラベルを、labeled は今付いたラベルを見る。labeled で別のラベルが付いたときは動かさない
    if: >-
      github.event_name == 'issues'
      && (
        (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'release'))
        || (github.event.action == 'labeled' && github.event.label.name == 'release')
      )
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      created: ${{ steps.once.outputs.created }}
    steps:
      # opened と labeled の両方で動いたり、ラベルを付け直したりしても、同じ Issue で 2 回動かさない。
      # 検査より前に確かめ、作り済みなら、検査も失敗の報告も動かさない。
      # 作り済みの印は、この workflow が PR を作った後に書くコメント。失敗したときは書かないため、直した後に再び動かせる。
      # 利用者のコメントで止められないよう、github-actions が書いたものだけを見る
      - name: この Issue でリリースの PR を作り済みかを確かめる
        id: once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          count=$(gh issue view "${ISSUE_NUMBER}" --json comments \
            --jq '[.comments[] | select(.author.login == "github-actions" and (.body | startswith("リリースの PR を作りました")))] | length')
          if [ "${count}" != "0" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "この Issue では、リリースの PR を作り済みのため、何もしない" >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    name: リリースする内容の検査
    # once が動かなかったとき（ラベルや書き込み権限の条件に合わない）は、この検査も動かない。作り済みのときも動かさない
    needs: once
    if: needs.once.outputs.created != 'true'
    permissions:
      contents: read
    # zizmor の self-repository は、書き方の勧め（$/ の形）で安全の問題ではない。リリースを手元で試せない書き方に変えないため、この行だけ無視する
    uses: ./.github/workflows/plugin-checks.yml # zizmor: ignore[self-repository]
    with:
      ref: develop
      base_ref: main

  create_release_pr:
    name: リリースの PR を作る
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          # main との差分と、既存のタグを見るため
          fetch-depth: 0
          fetch-tags: true
          # 後の step で release ブランチを git push するため、認証情報を残す
          persist-credentials: true

      - name: 版を読む
        id: meta
        # 3 つの plugin.json の版がそろっていることは、checks の check.py が確かめている
        run: echo "version=v$(jq -r .version plugins/aidd/.claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: リリースできるかを確かめる
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$(git log --oneline origin/main..origin/develop)" ]; then
            echo "::error::main に無いコミットが develop にありません"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::タグ ${VERSION} は既にあります。develop で plugin.json の版を上げてから、Issue のワークフローを再実行してください。plugins/ を変えていないときは docs/release.md の手作業の手順で出します"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/${VERSION}" > /dev/null; then
            echo "::error::ブランチ release/${VERSION} は既にあります"
            exit 1
          fi

      - name: release ブランチを作る
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: git push origin "HEAD:refs/heads/release/${VERSION}"

      - name: main への PR を作る
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          body=$(mktemp)
          # main は既定ブランチのため、マージで Issue が閉じる
          printf '%s\n\nCloses #%s\n' "${ISSUE_BODY}" "${ISSUE_NUMBER}" > "$body"
          pr_url=$(gh pr create \
            --base main \
            --head "release/${VERSION}" \
            --title "【Release】${VERSION} をリリース" \
            --label release \
            --body-file "$body")
          gh issue comment "${ISSUE_NUMBER}" --body "リリースの PR を作りました: ${pr_url}"
          echo "# リリースの PR" >> "$GITHUB_STEP_SUMMARY"
          echo "${pr_url}" >> "$GITHUB_STEP_SUMMARY"

  report_failure:
    name: 失敗を Issue に知らせる
    needs: [once, checks, create_release_pr]
    if: failure() && github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Issue にコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --body "リリースの PR を作れませんでした。原因はログを見てください: ${RUN_URL}"

  publish_release:
    name: タグと Release を作る
    # hotfix/ と release/<YYYY-MM-DD> は手作業で Release を作るため、release/v<version> の PR だけを受ける
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'release')
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version="${HEAD_REF#release/}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ブランチ名 ${HEAD_REF} から版を読めません"
            exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/${version}" > /dev/null 2>&1; then
            echo "::error::タグ ${version} は既にあります"
            exit 1
          fi
          # 説明は、前のタグから入った PR のタイトルの一覧になる
          release_url=$(gh release create "$version" \
            --target "$MERGE_SHA" \
            --title "$version" \
            --generate-notes)
          comment="${version} をリリースしました: ${release_url}"
          gh pr comment "$PR_NUMBER" --body "$comment"
          for issue in $(gh pr view "$PR_NUMBER" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'); do
            gh issue comment "$issue" --body "$comment"
          done
          echo "# ${comment}" >> "$GITHUB_STEP_SUMMARY"
