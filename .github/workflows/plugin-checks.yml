name: プラグインの検査

on:
  pull_request:
    # main はリリース、develop は普段の変更の PR を受ける（ブランチの決まりは CONTRIBUTING.md）
    branches: [main, develop]
    # edited は、マージ先の付け替えで動き直すため。既定の 3 つだけだと、前のマージ先での結果が残る
    # タイトル・本文の編集でも動くが、条件で飛ばさない。飛ばしたジョブは成功と報告され、前の失敗を隠すため
    types: [opened, synchronize, reopened, edited]
  # release.yml から呼ぶ。Actions が GITHUB_TOKEN で作ったリリースの PR では、pull_request で動かないため
  workflow_call:
    inputs:
      ref:
        description: 検査するブランチ
        type: string
        required: true
      base_ref:
        description: マージ先のブランチ（main なら版の上げ忘れも見る）
        type: string
        required: true

permissions: {}

jobs:
  check:
    name: 整合チェックとマニフェストの検証
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Claude Code の版を固定する。固定しないと、新しい版の検査の変化で CI が急に落ちるため
      # Ref: https://www.npmjs.com/package/@anthropic-ai/claude-code
      CLAUDE_CODE_VERSION: "2.1.296"
      MOD_DIR: plugins/config/skills/mod-output-customize/files/mod-output-customize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request では空になり、PR の内容を取る
          ref: ${{ inputs.ref }}
          # 版の検査で、マージ先のブランチと比べるため
          fetch-depth: 0
          # 取得の後に git で push などをしないため、トークンを .git/config に残さない
          persist-credentials: false

      - name: 整合チェック（スキルと配る設定・版）
        # 手順は .claude/skills/marketplace-update/SKILL.md。NG があれば終了コード 1 で落ちる
        # main への PR とリリースの Issue（release.yml）では、plugins/ を変えたのに版を上げていないものも落とす
        env:
          BASE_REF: ${{ inputs.base_ref || github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            python3 .claude/skills/marketplace-update/scripts/check.py --base "origin/$BASE_REF"
          else
            python3 .claude/skills/marketplace-update/scripts/check.py
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: マニフェストを検証
        # ログインは要らない。mod はマーケットプレイスのプラグインではないため、フォルダを直接渡す
        # マーケットプレイスは --strict で、plugin.json の version 漏れも落とす。mod は情報の警告が出るため付けない
        run: |
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict .
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate "$MOD_DIR"

      - name: mod のテスト
        run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin test "$MOD_DIR"

  workflow-check:
    name: ワークフローの検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # init-repo が配る雛形。配る前に、利用先の pr-checks.yml と同じ検査を当てる
      TEMPLATE_DIR: plugins/project/skills/init-repo/files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request では空になり、PR の内容を取る
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: ワークフローの書き方を zizmor で検査
        # 雛形の pr-checks.yml と同じ検査。版は雛形とそろえる（.claude/rules/duplicated-files.md）
        # リポジトリの直下を渡すと、.github/ と雛形の .github/（dependabot.yml を含む）の両方を集める
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --format=github .

      - name: permissions と timeout-minutes を検査
        # スクリプトは雛形のものを直接使い、中身を 1 か所に保つ
        run: |
          status=0
          for dir in .github/workflows "$TEMPLATE_DIR/.github/workflows"; do
            bash "$TEMPLATE_DIR/.github/scripts/check-workflows.sh" "$dir" || status=1
          done
          exit "$status"
