name: Claude による Issue の実装

# Issue のコメントに @claude と書くと、次の順に動く。作りは Anthropic の「Building effective agents」の型にならう
# （https://www.anthropic.com/research/building-effective-agents）。手順は .claude/skills/issue-to-pr/SKILL.md
#   1. 実装：Claude Code が Issue を実装し、作業ブランチ（issues/<Issue 番号>-claude-<日時>）に push して、develop 向けの下書きの PR を作る
#   2. CI の直し：CI（PR のチェック）を待ち、落ちたらログを渡して直させる。最大 3 回（停止条件はワークフローが数える）
#   3. レビュー：CI が通ったら PR をレビュー待ちにし、/security-review・公式の code-review・docs-sync を流す。どれもファイルは変えない
#   4. レビューの直し：直すべき指摘があれば、1 回だけ直させる
#   5. CI の直し：4 で直したら、もう一度 CI を待ち、落ちたら直させる。最大 3 回
#   6. 仕上げ：最後の CI が通ったら、PR 本文の「AI を使った確認」の 3 行（docs-sync・marketplace-update・issue-pr-sync）を点検してチェックする。ファイルは変えない
#   7. 記録：計画・CI・レビュー・直し・仕上げを PR にコメントする。最後の CI が通らなければ、PR を下書きに戻す
# 流れの図は docs/claude-bot.md にある
# 守りは次のとおり
#   - 頼めるのは、所有者・メンバー・共同作業者のコメントだけ（ジョブの if）
#   - 直しの step が push できるのは、作業ブランチだけ（「直しの許可を決める」の step。--force や develop への push は許可に当たらない）
#   - .github/workflows/・.github/scripts/・.claude/settings.json・.claude/hooks/ の変更は、push の前（pre-push フック）と PR の差分で止める
#     （guard-paths.sh。止まった PR は下書きのまま残す）
# PR を作れなかったときは、Claude の最後の返答を理由として Issue にコメントする。マージは人が行う
# Claude にコミット・push を任せるのは、P1 の例外（docs/policies/p01-operation-boundary.md）
# PR の作成と push は、実装・直しの step の中で Claude App のトークンで行う。action は step の最後にこのトークンを取り消し、
# GITHUB_TOKEN で作った PR・push では CI（plugin-checks.yml）が動かないため。ワークフローの step は GITHUB_TOKEN で、コメントと下書きの切り替えだけを行う
# Issue・コメントのイベントでは、既定ブランチ（main）にあるこのファイルが使われる。変えても、リリースして main に入るまで反映されない
#
# 使えるようにする準備（App・environment・secret）、確かめ方、トークンの更新、止め方は docs/claude-bot.md にある
# 準備は、リポジトリの設定と secret の変更のため、人が行う。Claude は行わない
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    name: Issue を実装して PR を作る
    # PR のコメントでは動かさない。Issue の実装だけを頼めるようにするため
    # 頼めるのは、リポジトリの所有者・メンバー・共同作業者だけ。権限の無い人のコメントでは、ジョブを始めない
    # （始めると、concurrency で、権限のある人の待ちの依頼が置き換わるため）
    if: >-
      contains(github.event.comment.body, '@claude')
      && !github.event.issue.pull_request
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    environment: claude
    # 実装 25 分、CI の待ち（1 回最大 25 分）と直し（15 分）の 3 回 × 2、レビュー 50 分（docs-sync の 15 分を含む）、仕上げ 20 分を足した上限
    timeout-minutes: 335
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
      statuses: read
    env:
      # 直しの step で bot に許すコマンド。issue-to-pr スキルの手順 9 で使うものだけにする。手順にコマンドを足したら、ここにも足す
      # git push は、作業ブランチの名前が決まってから足す（「直しの許可を決める」の step）。送り先を絞らないと、--force や develop への push も通るため
      FIX_TOOLS_BASE: "Skill,Read,Glob,Grep,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git show:*),Bash(git log:*),Bash(bash .claude/skills/issue-to-pr/scripts/verify.sh),Bash(node plugins/aidd/scripts/body_length.js:*),Bash(claude plugin validate:*),Bash(claude plugin test:*)"
    steps:
      # issue_comment では既定ブランチ（main）を取るため、develop を渡す。規約と deny を、作業の起点と同じ版で読ませるため
      # 過去のコミットを読む Issue があるため、全履歴を取る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      # CI を待つスクリプトと、変えさせないファイルを止めるスクリプトを、bot が書き換えられない場所（作業フォルダの外）に、bot が動く前に写す
      # 止めるスクリプトは、git の pre-push フックとしても据える。bot が push する前に、.github/workflows/ などの変更を止めるため
      # レビューと仕上げの段で使う検査のスクリプト（check.py・docs-sync の run-checks.sh・body_length.js）も写す。
      # 実装した bot が書き換えた版を、Issue・PR を書き換えられる段で動かさないため
      - name: ワークフローのスクリプトを取り分ける
        run: |
          mkdir -p "$RUNNER_TEMP/trusted/hooks"
          cp .github/scripts/wait-pr-checks.sh .github/scripts/guard-paths.sh "$RUNNER_TEMP/trusted/"
          cp .claude/skills/marketplace-update/scripts/check.py plugins/aidd/skills/docs-sync/scripts/run-checks.sh \
            plugins/aidd/scripts/body_length.js "$RUNNER_TEMP/trusted/"
          printf '#!/usr/bin/env bash\nexec bash "%s/trusted/guard-paths.sh" --pre-push "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/trusted/hooks/pre-push"
          chmod +x "$RUNNER_TEMP/trusted/hooks/pre-push"
          git config core.hooksPath "$RUNNER_TEMP/trusted/hooks"

      # Actions の Claude App には、コミットと push を任せる（P1 の例外）。リポジトリの deny は手元の Claude 向けのため、
      # ランナーの中だけで外す。--skip-worktree で、書き換えた settings.json がコミットに入らないようにする
      - name: コミットと push の deny を外す
        run: |
          jq '.permissions.deny |= map(select(test("^(Bash|PowerShell)\\(git (-[cC] \\* )?(commit|push)") | not))' \
            .claude/settings.json > "$RUNNER_TEMP/settings.json"
          mv "$RUNNER_TEMP/settings.json" .claude/settings.json
          git update-index --skip-worktree .claude/settings.json

      # トークンが空・空白だけだと、Claude は理由を出さずに落ちるため、ここで分かるメッセージで止める
      - name: トークンを確かめる
        id: check
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 全角スペース（U+3000）も空白として除く
          if [ -z "$(printf '%s' "$TOKEN" | LC_ALL=C sed 's/\xe3\x80\x80//g' | tr -d '[:space:]')" ]; then
            error="トークンが空か空白だけです。environment「claude」の secret CLAUDE_CODE_OAUTH_TOKEN を登録し直してください"
            echo "error=$error" >> "$GITHUB_OUTPUT"
            echo "::error::$error"
            exit 1
          fi

      # ===== 1. 実装
      - name: Claude Code で実装する
        id: claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 25
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: develop
          branch_prefix: issues/
          branch_name_template: "{{prefix}}{{entityNumber}}-claude-{{timestamp}}"
          # tag モードの既定では PR を作らずリンクを書くだけなので、gh pr create を許し、下書きの PR の作成まで指示する
          claude_args: |
            --model opus
            --max-turns 100
            --allowedTools "Skill,Bash(gh pr create:*),Bash(gh issue view:*),Bash(git show:*),Bash(git log:*),Bash(bash .claude/skills/issue-to-pr/scripts/verify.sh),Bash(node plugins/aidd/scripts/body_length.js:*),Bash(claude plugin validate:*),Bash(claude plugin test:*)"
            --append-system-prompt "issue-to-pr スキルの手順 1〜8 で、Issue を実装して下書きの PR を作る。"

      - name: できた PR を探す
        id: pr
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          [ -n "$BRANCH" ] || exit 0
          pr=$(gh pr list --head "$BRANCH" --state open --json number,changedFiles,additions,deletions,files --jq '.[0] // empty')
          [ -n "$pr" ] || exit 0
          # レビューの effort を、規模（ファイル数と変更行数の重いほう）で決め、影響の大きいファイルを触っていたら 1 段上げる（routing）
          # 段階: 3 ファイル・100 行以下は medium、10 ファイル・500 行以下も medium、それより多いと high（low は使わない）
          # ファイルの種類で 1 段上がるのは、2 段目（medium）から high へのときだけ。最小の段は、上がっても medium のまま
          files=$(jq .changedFiles <<< "$pr")
          lines=$(jq '.additions + .deletions' <<< "$pr")
          level=0
          # コードレビューのモデル。差分が多い（最大の段）ときは sonnet、それ以外は opus（ファイルの種類では変えない）
          cr_model=opus
          if [ "$files" -gt 10 ] || [ "$lines" -gt 500 ]; then level=2; cr_model=sonnet
          elif [ "$files" -gt 3 ] || [ "$lines" -gt 100 ]; then level=1
          fi
          if jq -r '.files[].path' <<< "$pr" | grep -qE '^\.github/|(^|/)\.claude/(settings\.json|hooks/)|(^|/)plugin\.json$|\.(sh|py|js|mjs|ts|tsx)$'; then
            level=$(( level < 2 ? level + 1 : 2 ))
          fi
          case "$level" in
            0) effort=medium ;;
            1) effort=medium ;;
            *) effort=high ;;
          esac
          # 記録の置き場所。issue-to-pr スキルが計画と確かめたことを書く場所と同じ（.claude/rules/tmp-output.md）
          dir="tmp/${BRANCH//\//-}/issue-to-pr"
          mkdir -p "$dir"
          { echo "number=$(jq .number <<< "$pr")"; echo "dir=$dir"; echo "effort=$effort"; echo "cr_model=$cr_model"; } >> "$GITHUB_OUTPUT"

      # 直しの step の許可に、作業ブランチだけへの push を足す。完全一致で書くため、--force や別のブランチへの push は許可に当たらない
      - name: 直しの許可を決める
        if: always() && steps.pr.outputs.number != ''
        env:
          BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: echo "FIX_TOOLS=${FIX_TOOLS_BASE},Bash(git push origin ${BRANCH})" >> "$GITHUB_ENV"

      # bot が変えてはいけないファイルが、PR に入っていないかを確かめる。入っていたら、レビュー待ちにしない
      # push 前のフックを通らない経路（API でのコミット）の備えでもある。直しの後にも、記録の step でもう一度確かめる
      - name: 変えてはいけないファイルを確かめる
        id: guard
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: |
          # gh pr view --json files は、改名・移動したファイルの新しいパスしか返さない。元のパス（previous_filename）も渡すため、API で取る
          if gh api --paginate "repos/$GH_REPO/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)' | bash "$RUNNER_TEMP/trusted/guard-paths.sh" --files > "$DIR/guard.log" 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            cat "$DIR/guard.log"
          fi

      # ===== 2. CI の直し（最大 3 回）
      # 「CI を待つ」は、作業ブランチの先頭に手元を合わせ、そのコミットのチェックを待ち、落ちたログを ci-<段>-<回>.log に書く
      # 「CI の失敗を直す」は、待つ step が fail のときだけ動く。直しが失敗したら、次の待つ step は動かず、そこで止まる
      - name: CI を待つ（1-0：実装の後）
        id: w10
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: bash "$RUNNER_TEMP/trusted/wait-pr-checks.sh" "$PR" "$BRANCH" "$DIR/ci-1-0.log"

      - name: CI の失敗を直す（1-1）
        id: f11
        if: always() && steps.w10.outputs.result == 'fail'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            issue-to-pr スキルの手順 9 で、Issue #${{ github.event.issue.number }} の下書きの PR #${{ steps.pr.outputs.number }} の CI の失敗（`${{ steps.pr.outputs.dir }}/ci-1-0.log`）を直す。
            作業ブランチ ${{ steps.claude.outputs.branch_name }} は checkout 済み。直したら `git push origin ${{ steps.claude.outputs.branch_name }}` で push する。
          claude_args: |
            --model opus
            --max-turns 50
            --permission-mode acceptEdits
            --allowedTools "${{ env.FIX_TOOLS }}"

      - name: CI を待つ（1-1）
        id: w11
        if: always() && steps.f11.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: bash "$RUNNER_TEMP/trusted/wait-pr-checks.sh" "$PR" "$BRANCH" "$DIR/ci-1-1.log"

      - name: CI の失敗を直す（1-2）
        id: f12
        if: always() && steps.w11.outputs.result == 'fail'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            issue-to-pr スキルの手順 9 で、Issue #${{ github.event.issue.number }} の下書きの PR #${{ steps.pr.outputs.number }} の CI の失敗（`${{ steps.pr.outputs.dir }}/ci-1-1.log`）を直す。
            作業ブランチ ${{ steps.claude.outputs.branch_name }} は checkout 済み。直したら `git push origin ${{ steps.claude.outputs.branch_name }}` で push する。
          claude_args: |
            --model opus
            --max-turns 50
            --permission-mode acceptEdits
            --allowedTools "${{ env.FIX_TOOLS }}"

      - name: CI を待つ（1-2）
        id: w12
        if: always() && steps.f12.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: bash "$RUNNER_TEMP/trusted/wait-pr-checks.sh" "$PR" "$BRANCH" "$DIR/ci-1-2.log"

      - name: CI の失敗を直す（1-3）
        id: f13
        if: always() && steps.w12.outputs.result == 'fail'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            issue-to-pr スキルの手順 9 で、Issue #${{ github.event.issue.number }} の下書きの PR #${{ steps.pr.outputs.number }} の CI の失敗（`${{ steps.pr.outputs.dir }}/ci-1-2.log`）を直す。
            作業ブランチ ${{ steps.claude.outputs.branch_name }} は checkout 済み。直したら `git push origin ${{ steps.claude.outputs.branch_name }}` で push する。
          claude_args: |
            --model opus
            --max-turns 50
            --permission-mode acceptEdits
            --allowedTools "${{ env.FIX_TOOLS }}"

      - name: CI を待つ（1-3）
        id: w13
        if: always() && steps.f13.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: bash "$RUNNER_TEMP/trusted/wait-pr-checks.sh" "$PR" "$BRANCH" "$DIR/ci-1-3.log"

      # 最後に動いた待つ step の結果を、この段の結果にする
      - name: CI の結果をまとめる（1 段目）
        id: ci1
        if: always() && steps.pr.outputs.number != ''
        env:
          R0: ${{ steps.w10.outputs.result }}
          R1: ${{ steps.w11.outputs.result }}
          R2: ${{ steps.w12.outputs.result }}
          R3: ${{ steps.w13.outputs.result }}
          F1: ${{ steps.f11.outcome }}
          F2: ${{ steps.f12.outcome }}
          F3: ${{ steps.f13.outcome }}
        run: |
          result=
          for r in "$R0" "$R1" "$R2" "$R3"; do [ -n "$r" ] && result=$r; done
          fixes=0
          for f in "$F1" "$F2" "$F3"; do [ -n "$f" ] && [ "$f" != skipped ] && fixes=$((fixes + 1)); done
          { echo "result=${result:-unknown}"; echo "fixes=$fixes"; } >> "$GITHUB_OUTPUT"

      # ===== 3. レビュー（CI が通ったときだけ）
      # 公式の code-review は下書きの PR を飛ばすため、先にレビュー待ちにする。最後の CI が通らなければ、記録の step で下書きに戻す
      - name: レビュー待ちにする
        id: ready
        if: always() && steps.ci1.outputs.result == 'pass' && steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr ready "$PR"
          # レビューの直しがあったかを、この後の先頭と比べて決めるため、今の先頭を残す
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # /security-review は origin/HEAD（このリポジトリでは main）と比べるため、ランナーの中だけで develop に向け直す
      - name: セキュリティレビューの比べる先を develop にする
        if: always() && steps.ready.outcome == 'success'
        run: git remote set-head origin develop

      # Claude Code 同梱のコマンド。確信の高い脆弱性だけを、# Vuln 1: ... の見出しで出す
      - name: セキュリティレビュー
        id: security
        if: always() && steps.ready.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /security-review
          claude_args: |
            --model opus
            --effort ${{ steps.pr.outputs.effort }}
            --max-turns 50
            --allowedTools "Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep,LS,Task"

      # 公式の code-review。--comment で、指摘を行ごとに PR へコメントする（指摘が無ければ 1 件のまとめのコメント）
      # 行ごとのコメントのツールは、--allowedTools に名前があるときだけ action が用意する
      - name: コードレビュー
        id: codereview
        if: always() && steps.ready.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 20
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}
          claude_args: |
            --model ${{ steps.pr.outputs.cr_model }}
            --effort ${{ steps.pr.outputs.effort }}
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # docs-sync の機械チェック（手順 2）は、bot が動く前に取り分けた写しで、ワークフローが流す。Claude には結果だけを渡す
      # トークンを渡さない。終了コードは 0（PASS）・1（FAIL あり）なら次の段へ進み、2（ERROR）・3（STOP）なら点検しない
      - name: docs-sync の機械チェックを流す
        id: dscheck
        if: always() && steps.ready.outcome == 'success'
        env:
          DIR: ${{ steps.pr.outputs.dir }}
        run: |
          code=0
          bash "$RUNNER_TEMP/trusted/run-checks.sh" --base origin/develop > "$DIR/docs-sync-checks.log" 2>&1 || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # 文書の追従を点検する。実装した bot とは別の目で見るため、レビューの段に置く。ファイルは変えず、レポートだけを書く
      # docs-sync はプラグインのスキルで、bot からは呼べないため、SKILL.md を直接読ませる
      - name: 文書の追従を点検する（docs-sync）
        id: docssync
        if: always() && (steps.dscheck.outputs.code == '0' || steps.dscheck.outputs.code == '1')
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            `plugins/aidd/skills/docs-sync/SKILL.md` を読み、その手順で、PR #${{ steps.pr.outputs.number }} の作業ブランチ ${{ steps.claude.outputs.branch_name }} の変更に文書が追従しているかを点検する。リポジトリのファイルは変えない。
            - `${CLAUDE_PLUGIN_ROOT}` は `plugins/aidd` に読み替える
            - 手順 1 の比べるブランチは `origin/develop`（このリポジトリの PR のマージ先）
            - 手順 2 のスクリプトは、ワークフローが `--base origin/develop` で流した。出力は `${{ steps.pr.outputs.dir }}/docs-sync-checks.log`、終了コードは ${{ steps.dscheck.outputs.code }}。流し直さずに、この出力を使う
            - 手順 4 のレポートは、SKILL.md の出力先の代わりに `${{ steps.pr.outputs.dir }}/docs-sync.md` に書く
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Edit(tmp/**),Bash(git branch --show-current),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(date:*)"

      # 直すかは、3 つの決まった出力で決める。どれも、確信の高い指摘か、重さを分けた指摘を出す作りのため
      # セキュリティ：脆弱性の見出し（# Vuln）があれば直す。コードレビュー：結果があり、「No issues found」が無いか、行ごとの指摘があれば直す
      # docs-sync：レポートの high・medium に指摘があれば直す。low は直さない（ADR のリンク切れなど、直さない指摘を含むため）
      # 行ごとの指摘は、gh pr view --comments では読めないため、ここで API から取って review-feedback.md に載せる
      - name: レビューの結果を集める
        id: reviews
        if: always() && steps.ready.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          DIR: ${{ steps.pr.outputs.dir }}
          SEC_FILE: ${{ steps.security.outputs.execution_file }}
          CR_FILE: ${{ steps.codereview.outputs.execution_file }}
          DS_CODE: ${{ steps.dscheck.outputs.code }}
        run: |
          result_of() { [ -n "$1" ] && jq -r '.[-1].result // empty' "$1" 2>/dev/null; }
          # レポートの「## <見出し>」の節から、「なし」と空行を除いた行を出す
          section_of() { [ -f "$1" ] && awk -v h="## $2" '$0 == h { f = 1; next } /^## / { f = 0 } f' "$1" | grep -vE '^[[:space:]]*(なし)?[[:space:]]*$'; }
          sec=$(result_of "$SEC_FILE" || true)
          cr=$(result_of "$CR_FILE" || true)
          ds_high=$(section_of "$DIR/docs-sync.md" high || true)
          ds_medium=$(section_of "$DIR/docs-sync.md" medium || true)
          # 行ごとの指摘。本文の改行は空白に直し、1 件 1 行にする
          inline=$(gh api "repos/$GH_REPO/pulls/$PR/comments" --paginate \
            --jq '.[] | "- `\(.path):\(.line // .original_line // "?")` \(.body | gsub("[\r\n]+"; " "))"' 2>/dev/null || true)
          printf '%s\n' "${sec:-（結果なし）}" > "$DIR/security-review.md"
          printf '%s\n' "${cr:-（結果なし）}" > "$DIR/code-review.md"
          printf '%s\n' "${inline:-（行ごとの指摘なし）}" > "$DIR/code-review-inline.md"
          need=false
          if grep -qiE '^#+[[:space:]]*Vuln' "$DIR/security-review.md"; then need=true; fi
          if [ -n "$cr" ] && ! grep -qi 'No issues found' <<< "$cr"; then need=true; fi
          if [ -n "$inline" ]; then need=true; fi
          if [ -n "$ds_high" ] || [ -n "$ds_medium" ]; then need=true; fi
          {
            echo "## セキュリティレビュー（/security-review）"
            echo
            cat "$DIR/security-review.md"
            echo
            echo "## コードレビュー（code-review）"
            echo
            cat "$DIR/code-review.md"
            echo
            echo "### 行ごとの指摘"
            echo
            cat "$DIR/code-review-inline.md"
            echo
            echo "## 文書の追従（docs-sync の high・medium）"
            echo
            if [ -f "$DIR/docs-sync.md" ]; then
              printf '### high\n\n%s\n\n### medium\n\n%s\n' "${ds_high:-なし}" "${ds_medium:-なし}"
            else
              echo "（結果なし。機械チェックの終了コード：${DS_CODE:-なし}）"
            fi
          } > "$DIR/review-feedback.md"
          echo "need=$need" >> "$GITHUB_OUTPUT"

      # ===== 4. レビューの直し（1 回だけ）
      - name: レビューの指摘を直す
        id: rfix
        if: always() && steps.reviews.outputs.need == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            issue-to-pr スキルの手順 9 で、Issue #${{ github.event.issue.number }} の PR #${{ steps.pr.outputs.number }} へのレビューの指摘（`${{ steps.pr.outputs.dir }}/review-feedback.md`）を直す。
            直すべき指摘が無ければ、何も変えずに終わる。
            作業ブランチ ${{ steps.claude.outputs.branch_name }} は checkout 済み。直したら `git push origin ${{ steps.claude.outputs.branch_name }}` で push する。
          claude_args: |
            --model opus
            --max-turns 50
            --permission-mode acceptEdits
            --allowedTools "${{ env.FIX_TOOLS }}"

      - name: レビューの直しで変わったかを確かめる
        id: rfixed
        if: always() && steps.rfix.outcome == 'success'
        env:
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BEFORE: ${{ steps.ready.outputs.sha }}
        run: |
          if git fetch --quiet origin "$BRANCH" && [ "$(git rev-parse FETCH_HEAD)" != "$BEFORE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ===== 5. CI の直し（最大 3 回）。レビューの直しで変わったときだけ
      - name: CI を待つ（2-0：レビューの直しの後）
        id: w20
        if: always() && steps.rfixed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: bash "$RUNNER_TEMP/trusted/wait-pr-checks.sh" "$PR" "$BRANCH" "$DIR/ci-2-0.log"

      - name: CI の失敗を直す（2-1）
        id: f21
        if: always() && steps.w20.outputs.result == 'fail'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            issue-to-pr スキルの手順 9 で、Issue #${{ github.event.issue.number }} の PR #${{ steps.pr.outputs.number }} の CI の失敗（`${{ steps.pr.outputs.dir }}/ci-2-0.log`）を直す。
            作業ブランチ ${{ steps.claude.outputs.branch_name }} は checkout 済み。直したら `git push origin ${{ steps.claude.outputs.branch_name }}` で push する。
          claude_args: |
            --model opus
            --max-turns 50
            --permission-mode acceptEdits
            --allowedTools "${{ env.FIX_TOOLS }}"

      - name: CI を待つ（2-1）
        id: w21
        if: always() && steps.f21.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: bash "$RUNNER_TEMP/trusted/wait-pr-checks.sh" "$PR" "$BRANCH" "$DIR/ci-2-1.log"

      - name: CI の失敗を直す（2-2）
        id: f22
        if: always() && steps.w21.outputs.result == 'fail'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            issue-to-pr スキルの手順 9 で、Issue #${{ github.event.issue.number }} の PR #${{ steps.pr.outputs.number }} の CI の失敗（`${{ steps.pr.outputs.dir }}/ci-2-1.log`）を直す。
            作業ブランチ ${{ steps.claude.outputs.branch_name }} は checkout 済み。直したら `git push origin ${{ steps.claude.outputs.branch_name }}` で push する。
          claude_args: |
            --model opus
            --max-turns 50
            --permission-mode acceptEdits
            --allowedTools "${{ env.FIX_TOOLS }}"

      - name: CI を待つ（2-2）
        id: w22
        if: always() && steps.f22.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: bash "$RUNNER_TEMP/trusted/wait-pr-checks.sh" "$PR" "$BRANCH" "$DIR/ci-2-2.log"

      - name: CI の失敗を直す（2-3）
        id: f23
        if: always() && steps.w22.outputs.result == 'fail'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            issue-to-pr スキルの手順 9 で、Issue #${{ github.event.issue.number }} の PR #${{ steps.pr.outputs.number }} の CI の失敗（`${{ steps.pr.outputs.dir }}/ci-2-2.log`）を直す。
            作業ブランチ ${{ steps.claude.outputs.branch_name }} は checkout 済み。直したら `git push origin ${{ steps.claude.outputs.branch_name }}` で push する。
          claude_args: |
            --model opus
            --max-turns 50
            --permission-mode acceptEdits
            --allowedTools "${{ env.FIX_TOOLS }}"

      - name: CI を待つ（2-3）
        id: w23
        if: always() && steps.f23.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: bash "$RUNNER_TEMP/trusted/wait-pr-checks.sh" "$PR" "$BRANCH" "$DIR/ci-2-3.log"

      - name: CI の結果をまとめる（2 段目）
        id: ci2
        if: always() && steps.rfixed.outputs.changed == 'true'
        env:
          R0: ${{ steps.w20.outputs.result }}
          R1: ${{ steps.w21.outputs.result }}
          R2: ${{ steps.w22.outputs.result }}
          R3: ${{ steps.w23.outputs.result }}
          F1: ${{ steps.f21.outcome }}
          F2: ${{ steps.f22.outcome }}
          F3: ${{ steps.f23.outcome }}
        run: |
          result=
          for r in "$R0" "$R1" "$R2" "$R3"; do [ -n "$r" ] && result=$r; done
          fixes=0
          for f in "$F1" "$F2" "$F3"; do [ -n "$f" ] && [ "$f" != skipped ] && fixes=$((fixes + 1)); done
          { echo "result=${result:-unknown}"; echo "fixes=$fixes"; } >> "$GITHUB_OUTPUT"

      # bot が変えてはいけないファイルが、直しの後も含めて PR に入っていないかを、もう一度確かめる
      # 改名・移動の元のパス（previous_filename）も渡すため、gh pr view ではなく API で取る
      - name: 変えてはいけないファイルを確かめ直す
        id: guard2
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          DIR: ${{ steps.pr.outputs.dir }}
        run: |
          if gh api --paginate "repos/$GH_REPO/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)' | bash "$RUNNER_TEMP/trusted/guard-paths.sh" --files > "$DIR/guard.log" 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            cat "$DIR/guard.log"
          fi

      # ===== 6. 仕上げ。最後の CI が通り、変えてはいけないファイルが入っていないときだけ
      # 点検に使う検査は、取り分けた写しで、ワークフローが今の先頭で流す。トークンを渡さない
      # marketplace-update の手順 6（validate・test）は、PR の CI（plugin-checks.yml）が同じコマンドを流しているため、ここでは流さない
      - name: 仕上げの検査を流す
        id: fcheck
        if: >-
          always() && steps.ready.outcome == 'success' && steps.guard2.outputs.ok == 'true'
          && (steps.rfixed.outputs.changed != 'true' || steps.ci2.outputs.result == 'pass')
        continue-on-error: true
        env:
          DIR: ${{ steps.pr.outputs.dir }}
          CHANGED: ${{ steps.rfixed.outputs.changed }}
          READY_SHA: ${{ steps.ready.outputs.sha }}
        run: |
          # 直しで変わっていないのに先頭が違うとき（直しの step が push した後に失敗したなど）は、CI で確かめていない先頭のため、仕上げない
          if [ "$CHANGED" != true ] && [ "$(git rev-parse HEAD)" != "$READY_SHA" ]; then
            echo "::warning::先頭がレビュー待ちにしたときと違い、CI で確かめていないため、仕上げをしない"
            exit 1
          fi
          python3 -B "$RUNNER_TEMP/trusted/check.py" > "$DIR/check-final.log" 2>&1 || true
          # レビューの直しで変わったときだけ、docs-sync の機械チェックを流し直す
          ds_code=
          if [ "$CHANGED" = true ]; then
            ds_code=0
            bash "$RUNNER_TEMP/trusted/run-checks.sh" --base origin/develop > "$DIR/docs-sync-checks-final.log" 2>&1 || ds_code=$?
          fi
          { echo "sha=$(git rev-parse --short HEAD)"; echo "ds_code=$ds_code"; } >> "$GITHUB_OUTPUT"

      # PR 本文の「AI を使った確認」の 3 行を点検してチェックし、承認の要らない Issue・PR の更新を反映する（P1 の例外）
      # 書き込みは tmp/ と、gh issue edit・gh pr edit だけに絞る。リポジトリのファイルは変えない
      - name: AI を使った確認を仕上げる
        id: finish
        if: always() && steps.fcheck.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        timeout-minutes: 20
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            issue-to-pr スキルの手順 10 で、Issue #${{ github.event.issue.number }} の PR #${{ steps.pr.outputs.number }} の「AI を使った確認」を仕上げる。
            - 記録のフォルダ：`${{ steps.pr.outputs.dir }}`
            - 点検するコミット：${{ steps.fcheck.outputs.sha }}（最後の CI が通った先頭）
            - レビューの直しで変わったか：${{ steps.rfixed.outputs.changed == 'true' && 'true' || 'false' }}
            - docs-sync の機械チェックを流し直した終了コード：${{ steps.fcheck.outputs.ds_code || '流し直していない' }}
            - `body_length.js` の写し：`${{ runner.temp }}/trusted/body_length.js`
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit(tmp/**),Bash(git branch --show-current),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(date:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh label list:*),Bash(node ${{ runner.temp }}/trusted/body_length.js:*)"

      # ===== 7. 記録。コメントには起動語を書かない。GITHUB_TOKEN のコメントではワークフローは動かないが、読み手が真似ないようにするため
      - name: 結果を PR に書く
        if: always() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          DIR: ${{ steps.pr.outputs.dir }}
          GUARD_OK: ${{ steps.guard2.outputs.ok }}
          DS_OUTCOME: ${{ steps.docssync.outcome }}
          DS_CODE: ${{ steps.dscheck.outputs.code }}
          FINISH_OUTCOME: ${{ steps.finish.outcome }}
          CI1: ${{ steps.ci1.outputs.result }}
          CI1_FIXES: ${{ steps.ci1.outputs.fixes }}
          READY: ${{ steps.ready.outcome }}
          SEC_OUTCOME: ${{ steps.security.outcome }}
          CR_OUTCOME: ${{ steps.codereview.outcome }}
          NEED: ${{ steps.reviews.outputs.need }}
          RFIX_OUTCOME: ${{ steps.rfix.outcome }}
          CHANGED: ${{ steps.rfixed.outputs.changed }}
          CI2: ${{ steps.ci2.outputs.result }}
          CI2_FIXES: ${{ steps.ci2.outputs.fixes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ci_label() { case "$1" in pass) echo "通った" ;; fail) echo "通らなかった" ;; unknown) echo "確かめられなかった（時間切れなど）" ;; *) echo "動かなかった" ;; esac; }
          step_label() { case "$1" in success) echo "終わった" ;; failure) echo "失敗した" ;; *) echo "動かなかった" ;; esac; }
          # 最後の CI で決める。レビューの直しで変わったなら 2 段目、変わっていなければ 1 段目
          if [ "$CHANGED" = true ]; then final=$CI2; else final=$CI1; fi
          # 「変えてはいけないファイルを確かめ直す」の結果を使う。確かめられなかったときも、止める側に倒す
          if [ "$GUARD_OK" = true ]; then blocked=false; else blocked=true; fi
          if { [ "$final" != pass ] || [ "$blocked" = true ]; } && [ "$READY" = success ]; then
            gh pr ready --undo "$PR"
          fi
          # 一番新しい CI の失敗のログ（ci-<段>-<回>.log）を載せる
          last_log=$(ls -1 "$DIR"/ci-*.log 2>/dev/null | sort | tail -n 1 || true)
          body="$DIR/record.md"
          {
            echo "Claude の作業記録（[実行ログ]($RUN_URL)）"
            echo
            if [ "$blocked" = true ]; then
              echo "bot が変えてはいけないファイルの変更が入っているため、下書きのまま残しています。変更を確かめてから、人が判断してください。"
              printf '\n```text\n'
              cat "$DIR/guard.log"
              printf '```\n'
            elif [ "$final" = pass ]; then
              echo "最後の CI が通ったため、レビュー待ちにしています。マージは人が判断してください。"
            else
              echo "最後の CI が通らなかったため、下書きのまま残しています。"
            fi
            echo
            # 実装した Claude の記録（## 計画・## 確かめたこと・## 直したこと）をそのまま載せる
            if [ -s "$DIR/report.md" ]; then
              cat "$DIR/report.md"
            else
              printf '## 計画と確かめたこと\n\n（記録なし）\n'
            fi
            echo
            echo "## CI"
            echo
            echo "- 1 段目：$(ci_label "$CI1")（直し ${CI1_FIXES:-0} 回）"
            if [ "$CHANGED" = true ]; then
              echo "- 2 段目（レビューの直しの後）：$(ci_label "$CI2")（直し ${CI2_FIXES:-0} 回）"
            fi
            if [ "$final" != pass ] && [ -n "$last_log" ] && [ -s "$last_log" ]; then
              printf '\n<details><summary>最後に落ちた CI のログ（%s）</summary>\n\n' "$(basename "$last_log")"
              cat "$last_log"
              printf '\n</details>\n'
            fi
            echo
            echo "## レビュー"
            echo
            if [ "$READY" = success ]; then
              echo "- セキュリティレビュー（/security-review）：$(step_label "$SEC_OUTCOME")"
              echo "- コードレビュー（code-review）：$(step_label "$CR_OUTCOME")。指摘は PR の行ごとのコメントにある"
              case "$DS_CODE" in
                0|1) echo "- 文書の追従（docs-sync）：$(step_label "$DS_OUTCOME")" ;;
                *) echo "- 文書の追従（docs-sync）：機械チェックが止まったため、点検していない（終了コード ${DS_CODE:-なし}）" ;;
              esac
              echo "- 指摘の直し：$( [ "$NEED" = true ] && step_label "$RFIX_OUTCOME" || echo "直す指摘は無かった" )$( [ "$CHANGED" = true ] && echo "（変更あり）" )"
              if [ -s "$DIR/security-review.md" ]; then
                printf '\n<details><summary>セキュリティレビューの結果</summary>\n\n'
                cat "$DIR/security-review.md"
                printf '\n</details>\n'
              fi
              if [ -s "$DIR/docs-sync.md" ]; then
                printf '\n<details><summary>docs-sync のレポート</summary>\n\n'
                cat "$DIR/docs-sync.md"
                printf '\n</details>\n'
              fi
            else
              echo "CI が通らなかったため、レビューはしていない。"
            fi
            echo
            echo "## AI を使った確認"
            echo
            # 仕上げの段の記録（行ごとのチェックと根拠・残った指摘・反映しなかった案）を載せる
            if [ -s "$DIR/finish.md" ]; then
              cat "$DIR/finish.md"
            elif [ -n "$FINISH_OUTCOME" ] && [ "$FINISH_OUTCOME" != skipped ]; then
              echo "仕上げの段は$(step_label "$FINISH_OUTCOME")が、記録が無い。チェックは人が確かめて入れる。"
            else
              echo "仕上げの条件（最後の CI が通った・変えてはいけないファイルが無い・先頭を CI で確かめた）を満たさないため、仕上げはしていない。チェックは人が確かめて入れる。"
            fi
          } > "$body"
          gh pr comment "$PR" --body-file "$body"

      # PR が無いときだけ動く。Claude が動いた記録か、トークンの誤りがあるときに限る。
      # @claude-bot のように語の続くものや、書き込み権限の無い人のコメントでは、action が何もせずに終わるため、書かない
      - name: PR を作れなかった理由を Issue に書く
        if: always() && steps.pr.outputs.number == '' && (steps.check.outputs.error != '' || steps.claude.outputs.execution_file != '')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          TOKEN_ERROR: ${{ steps.check.outputs.error }}
        run: |
          # トークンで止めたときはその理由を、それ以外は Claude の最後の返答を、PR を作れなかった理由として載せる
          reason=${TOKEN_ERROR:-$(jq -r '.[-1].result // empty' "$EXEC_FILE" 2>/dev/null || true)}
          gh issue comment "$ISSUE" --body "Claude の実装で PR を作れませんでした。
          理由: ${reason:-（記録なし）}
          実行: $RUN_URL"
