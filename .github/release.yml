# 自動で作るリリースノート（release.yml の gh release create --generate-notes）の設定。手順は docs/release.md
# ワークフローの .github/workflows/release.yml とは別のファイル。この名前と場所は GitHub が決めている
# Ref: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      # リリースの PR（[Release] v<version> をリリース）は、中身の PR と重なるため一覧から外す
      - release
  # 見出しは PR のラベルで決まる。分類とラベルの対応は docs/policies/p12-title-category.md
  # 見出しは読む人が多い順。どの見出しにも当たらない PR（other ラベルなど）は「その他」に入る（"*"）
  categories:
    - title: 機能
      labels:
        - feature
        - enhancement
    - title: 不具合の修正
      labels:
        - bug
    - title: 文書
      labels:
        - docs
        - documentation
    - title: リファクタ
      labels:
        - refactor
    - title: 調査
      labels:
        - research
    - title: その他
      labels:
        - "*"
