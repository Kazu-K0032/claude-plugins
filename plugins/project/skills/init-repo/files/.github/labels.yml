# GitHub ラベルの定義
# Ref: https://github.com/crazy-max/ghaction-github-labeler/blob/master/README.md#yaml-configuration

- name: "bug"
  color: "d73a4a"
  description: "動作上の不具合"

- name: "feature"
  color: "0075ca"
  description: "新機能・機能改善の要求"

- name: "docs"
  color: "0052cc"
  description: "ドキュメントの追加・更新"

- name: "infra"
  color: "f9d0c4"
  description: "インフラ・Terraform"

- name: "refactor"
  color: "c2e0c6"
  description: "振る舞いを変えないコード構造の改善"

- name: "release"
  color: "0e8a16"
  description: "本番環境へのリリース作業"

- name: "test"
  color: "c4975a"
  description: "テストの追加・更新"

- name: "dependencies"
  color: "0366d6"
  description: "依存パッケージの更新"
